apiVersion: v1
kind: Namespace
metadata:
  name: django-app
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    # Lab pods are created at runtime by the backend's service account. "baseline"
    # makes the API refuse privileged pods, host namespaces and hostPath volumes
    # there, so a compromised backend cannot use that account to take over the node.
    # Requires the backend that mounts lab storage via PVCs (no hostPath).
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring