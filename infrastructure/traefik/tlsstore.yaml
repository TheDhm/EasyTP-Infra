# Traefik default TLSStore — what Traefik presents for hostnames that don't
# carry their own `spec.tls` block on the Ingress (notably the dynamic
# user-app ingresses created in the `apps` namespace).
#
# Without this resource, Traefik falls back to its built-in self-signed cert,
# which Cloudflare in Full (strict) SSL mode would reject with HTTP 525.
#
# `spec.defaultCertificate.secretName` MUST point to a `kubernetes.io/tls`
# Secret in the SAME namespace (kube-system). That Secret holds the CF Origin
# wildcard cert for *.melekabderrahmane.com and is provisioned out-of-band
# (`kubectl apply` against the cluster), NOT in git, because the repo is
# public and the Secret contains the matching private key. Refreshing the
# cert: regenerate it from the Cloudflare dashboard (SSL/TLS → Origin Server
# → Create Certificate) and `kubectl -n kube-system apply -f` the new
# Secret. This TLSStore is unaffected by that rotation.
#
# TLSStore named "default" in kube-system is Traefik's well-known fallback
# — do not rename or move it.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: cloudflare-origin-cert