apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: no-cache
  namespace: apps
spec:
  # Prevent browser caching of noVNC files (recommended by noVNC docs). Replaces
  # the nginx configuration-snippet the backend used to set, which Traefik never
  # applied. Referenced by create_ingress() in EasyTP-Backend as
  # `apps-no-cache@kubernetescrd`, so this must exist before that backend ships:
  # Traefik disables a router whose middleware is missing.
  headers:
    customResponseHeaders:
      Cache-Control: "no-cache, no-store, must-revalidate"
      Pragma: "no-cache"
      Expires: "0"
