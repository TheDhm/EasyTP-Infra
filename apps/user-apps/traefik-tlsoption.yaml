apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: require-cf-client-cert
  namespace: apps
spec:
  clientAuth:
    # Trust anchor: AOP root CA (cf-origin-ca-secret.yaml, same namespace).
    # Provider reads key `tls.ca`.
    secretNames:
      - cf-origin-ca
    # Per-user-app ingresses created by EasyTP-Backend's create_ingress() opt
    # into this via the annotation
    # `traefik.ingress.kubernetes.io/router.tls.options: apps-require-cf-client-cert@kubernetescrd`
    # added in shared/kubernetes/deployments.py. The server cert is provided by
    # the cluster-default TLSStore (kube-system/default -> cloudflare-origin-cert).
    clientAuthType: RequireAndVerifyClientCert