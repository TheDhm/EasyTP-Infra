apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: django-app
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: a rolling update starts the new pod while
  # the old one still has the data directory open. Two PostgreSQL instances on one
  # volume fight over postmaster.pid (seen on 2026-11-23: the new pod shut itself down
  # and had to run crash recovery) and can corrupt data.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgresql
        image: postgres:15.17
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: django_db
        - name: POSTGRES_USER
          value: django_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: django-app
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: django-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi