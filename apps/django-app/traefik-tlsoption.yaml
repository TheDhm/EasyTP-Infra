apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: require-cf-client-cert
  namespace: django-app
spec:
  clientAuth:
    # Trust anchor: the AOP root CA delivered via the cf-origin-ca Secret
    # (cf-origin-ca-secret.yaml). Provider reads key `tls.ca`.
    secretNames:
      - cf-origin-ca
    # Reject the TLS handshake unless the peer presents a client cert chaining
    # to the CA above. With AOP enabled per-hostname on the Cloudflare side,
    # CF's edge provides that cert; a direct-IP attacker cannot.
    clientAuthType: RequireAndVerifyClientCert