---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: django-app
  annotations:
    # Flux creates this once with the CF snapshot below; the S5c CronJob owns
    # sourceRange thereafter. `ssa: IfNotPresent` tells Flux to apply on first
    # creation and then leave the resource alone — NOT `reconcile: disabled`,
    # which makes Flux skip the resource entirely (including creation).
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  ipAllowList:
    # Match the TCP peer IP — after S5a (externalTrafficPolicy=Local +
    # forwardedHeaders.trustedIPs), the peer Traefik sees IS the CF edge.
    # NO ipStrategy block: setting depth: 1 would read XFF[-1] = the original
    # client IP (per CF's XFF rewrite + Traefik's append), and 403 every user.
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit-default
  namespace: django-app
  annotations:
    # excludedIPs holds the same CF list as cloudflare-only.sourceRange, so the
    # S5c CronJob owns this field too. Same `ssa: IfNotPresent` pattern.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
    sourceCriterion:
      # Bucket by real client IP, not by CF edge. After S5a our XFF is
      # `<client>, <CF-edge>`, so depth: 1 (rightmost) would land on the CF
      # edge and collapse every user behind one edge into one bucket.
      # excludedIPs walks XFF right-to-left, skips CF entries, returns the
      # first remaining = the original client.
      ipStrategy:
        excludedIPs:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32