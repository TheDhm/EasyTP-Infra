apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-ingress
  namespace: django-app
  annotations:
    traefik.ingress.kubernetes.io/proxy-body-size: "100m"
    traefik.ingress.kubernetes.io/ssl-redirect: "true"
    traefik.ingress.kubernetes.io/backend-protocol: "HTTP"
    traefik.ingress.kubernetes.io/router.middlewares: django-app-cloudflare-only@kubernetescrd,django-app-ratelimit-default@kubernetescrd
    # Cloudflare Authenticated Origin Pulls — Traefik refuses the TLS handshake
    # unless CF presents a client cert chaining to the CA in cf-origin-ca.
    # Removing this annotation reverts to default TLS without client-cert
    # enforcement (kept as a fast rollback path).
    traefik.ingress.kubernetes.io/router.tls.options: django-app-require-cf-client-cert@kubernetescrd
spec:
  tls:
  - hosts:
    - api.melekabderrahmane.com
    secretName: cloudflare-origin-cert
  rules:
  - host: api.melekabderrahmane.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80